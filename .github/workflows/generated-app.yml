name: Generated Fidj app
on:
  pull_request:
  push:
    branches: [master, main, 'v*']
  workflow_dispatch:
    inputs:
      generator_ref:
        description: Generator version branch or commit to validate
        default: f6b53e237c71c960b3cf2713f850d4390d163fbe
      sdk_ref:
        description: SDK version branch or commit to validate
        default: 413d053ccb4324fcfd0a754c5136fd48b1e19b23
permissions:
  contents: read
jobs:
  generate-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: mleweb
      - uses: actions/checkout@v4
        with:
          repository: ofidj/generator-fidj
          ref: ${{ inputs.generator_ref || 'f6b53e237c71c960b3cf2713f850d4390d163fbe' }}
          path: generator
      - uses: actions/checkout@v4
        with:
          repository: ofidj/fidj-node
          ref: ${{ inputs.sdk_ref || '413d053ccb4324fcfd0a754c5136fd48b1e19b23' }}
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            generator/package-lock.json
            mleweb/package-lock.json
      - name: Build and test the SDK
        working-directory: sdk
        run: npm ci && npm run build-dist && npm test
      - name: Test the generator
        working-directory: generator
        run: npm ci && npm test
      - name: Generate, build and test mleweb from scratch
        working-directory: mleweb
        env:
          FIDJ_GENERATOR_DIR: ${{ github.workspace }}/generator
          FIDJ_SDK_DIR: ${{ github.workspace }}/sdk/dist
        run: npm ci && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: mleweb-node-${{ matrix.node }}
          path: |
            mleweb/.gen/mleweb/dist
            mleweb/.gen/mleweb/www
            mleweb/.gen/mleweb/README.md

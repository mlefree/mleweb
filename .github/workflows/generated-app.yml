name: Generated Fidj app
on:
  pull_request:
  push:
    branches: [master, main, 'v*']
  workflow_dispatch:
    inputs:
      generator_ref:
        description: Generator version branch or commit to validate
        default: f8d96954ba05d8ebcb777a55e7ee6f5f0ff52a3a
      publish:
        description: Publish the generated site to gh-pages (mlefree.com)
        type: boolean
        default: false
      entry_ref:
        description: Entry version branch or commit to validate
        default: 6114cb3a44ffd6ef28547389c37993616c9eb224
      sdk_ref:
        description: SDK version branch or commit to validate
        default: e4502fd321704d189f9d64893c194683e2576325
permissions:
  contents: read
jobs:
  generate-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: mleweb
      - uses: actions/checkout@v4
        with:
          repository: ofidj/generator-fidj
          ref: ${{ inputs.generator_ref || 'f8d96954ba05d8ebcb777a55e7ee6f5f0ff52a3a' }}
          path: generator
      - uses: actions/checkout@v4
        with:
          repository: ofidj/fidj-node
          ref: ${{ inputs.sdk_ref || 'e4502fd321704d189f9d64893c194683e2576325' }}
          path: sdk
      - uses: actions/checkout@v4
        with:
          repository: ofidj/fidj-entry
          ref: ${{ inputs.entry_ref || '6114cb3a44ffd6ef28547389c37993616c9eb224' }}
          path: entry
      - uses: actions/checkout@v4
        with:
          repository: ofidj/fidj-api-contracts
          ref: cb5c02b6b6ca0115f419b5d0552894a74d47c731
          path: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            generator/package-lock.json
            mleweb/package-lock.json
      - name: Build coordinated API contracts
        working-directory: contracts
        run: npm install --package-lock=false && npm run build
      - name: Build and test the SDK
        working-directory: sdk
        run: npm ci && npm install --no-save --package-lock=false ../contracts/dist && npm run build-dist && npm test
      - name: Build the entry
        working-directory: entry
        run: npm install --package-lock=false --no-audit --no-fund && npm test
      - name: Test the generator
        working-directory: generator
        run: npm ci && npm test
      - name: Generate, build and test mleweb from scratch
        working-directory: mleweb
        env:
          FIDJ_GENERATOR_DIR: ${{ github.workspace }}/generator
          FIDJ_SDK_DIR: ${{ github.workspace }}/sdk/dist
          FIDJ_ENTRY_DIR: ${{ github.workspace }}/entry/dist
        run: npm ci && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: mleweb-node-${{ matrix.node }}
          path: |
            mleweb/.gen/mleweb/dist
            mleweb/.gen/mleweb/www
            mleweb/.gen/mleweb/README.md

  publish-pages:
    # mlefree.com serves the gh-pages branch. Publishing is deliberate: it happens
    # on master, or on an explicit dispatch, never from a version branch -- those
    # only validate.
    needs: generate-build-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mleweb-node-22
          path: generated
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Replace the published site with the generated one
        run: |
          set -euo pipefail
          test -f generated/www/index.html
          test -s generated/www/CNAME
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R generated/www/. pages/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Published site already up to date"
          else
            git commit -m "Publish generated mlefree.com from ${GITHUB_SHA}"
            git push
          fi
